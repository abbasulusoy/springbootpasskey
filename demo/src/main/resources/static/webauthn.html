<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ZAFE Passkey Login</title>
    <style>
        body { font-family: Arial; padding: 40px; }
        input, button { padding: 10px; margin: 5px; }
    </style>
</head>
<body>

<h2>🔐 Passkey (WebAuthn)</h2>

<input id="username" placeholder="Username" />
<br>

<button onclick="register()">Register Passkey</button>
<button onclick="login()">Login with Passkey</button>

<pre id="log"></pre>

<script>
    function log(msg) {
        document.getElementById("log").textContent += msg + "\n";
    }

    /* ---------- Helpers ---------- */

    // Base64URL → Uint8Array
    function base64urlToBuffer(base64url) {
        const base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
        const pad = '='.repeat((4 - base64.length % 4) % 4);
        const binary = atob(base64 + pad);
        return Uint8Array.from([...binary].map(c => c.charCodeAt(0)));
    }

    // Uint8Array → Base64URL
    function bufferToBase64url(buffer) {
        const binary = String.fromCharCode(...new Uint8Array(buffer));
        return btoa(binary)
            .replace(/\+/g, '-')
            .replace(/\//g, '_')
            .replace(/=/g, '');
    }

    /* ---------- REGISTER ---------- */

    async function register() {
        const username = document.getElementById("username").value;

        log("👉 Requesting register options...");

        const res = await fetch('/webauthn/register/options', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ username }),
            credentials: 'include'
        });

        const options = await res.json();

        // convert challenge + user.id
        options.challenge = base64urlToBuffer(options.challenge);
        options.user.id = base64urlToBuffer(options.user.id);

        log("👉 Calling authenticator...");

        const credential = await navigator.credentials.create({
            publicKey: options
        });

        const payload = {
            id: credential.id,
            rawId: bufferToBase64url(credential.rawId),
            type: credential.type,
            response: {
                clientDataJSON: bufferToBase64url(credential.response.clientDataJSON),
                attestationObject: bufferToBase64url(credential.response.attestationObject)
            }
        };

        log("👉 Sending credential to backend...");

        await fetch('/webauthn/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            credentials: 'include'
        });

        log("✅ Registration successful!");
    }

    /* ---------- LOGIN ---------- */

    async function login() {
        const username = document.getElementById("username").value;

        log("👉 Requesting login options...");

        const res = await fetch('/webauthn/authenticate/options', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ username }),
            credentials: 'include'
        });

        const options = await res.json();

        options.challenge = base64urlToBuffer(options.challenge);

        if (options.allowCredentials) {
            options.allowCredentials = options.allowCredentials.map(c => ({
                ...c,
                id: base64urlToBuffer(c.id)
            }));
        }

        log("👉 Calling authenticator...");

        const assertion = await navigator.credentials.get({
            publicKey: options
        });

        const payload = {
            id: assertion.id,
            rawId: bufferToBase64url(assertion.rawId),
            type: assertion.type,
            response: {
                clientDataJSON: bufferToBase64url(assertion.response.clientDataJSON),
                authenticatorData: bufferToBase64url(assertion.response.authenticatorData),
                signature: bufferToBase64url(assertion.response.signature),
                userHandle: assertion.response.userHandle
                    ? bufferToBase64url(assertion.response.userHandle)
                    : null
            }
        };

        log("👉 Sending assertion to backend...");

        await fetch('/webauthn/authenticate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        log("✅ Login successful!");
    }
</script>

</body>
</html>
